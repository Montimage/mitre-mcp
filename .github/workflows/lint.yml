name: Lint

on:
  push:
    branches: [main, develop, claude/*]
    paths-ignore:
      - "frontend/**"
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "**.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code formatting with Black
        run: |
          black --check --diff mitre_mcp/ tests/

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff mitre_mcp/ tests/

      - name: Lint with flake8
        run: |
          flake8 mitre_mcp/ tests/ --count --statistics --show-source

      - name: Type check with mypy
        run: |
          mypy mitre_mcp/

      - name: Check docstrings with Ruff (pydocstyle rules)
        run: |
          ruff check mitre_mcp/

  complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install radon
        run: |
          pip install radon

      - name: Check cyclomatic complexity
        run: |
          radon cc mitre_mcp/ -a -nb

      - name: Check maintainability index
        run: |
          radon mi mitre_mcp/ -nb
