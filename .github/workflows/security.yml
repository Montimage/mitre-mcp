name: Security

on:
  push:
    branches: [main, develop, claude/*]
    paths-ignore:
      - "frontend/**"
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "**.md"
      - "docs/**"
  schedule:
    # Run security checks daily at 2 AM UTC.
    # Keep-alive strategy: this scheduled trigger (plus workflow_dispatch)
    # is what prevents GitHub from auto-disabling the workflow after 60
    # days of repository inactivity. If the workflow is already in state
    # disabled_inactivity, a repository admin must re-enable it once under
    # Actions; thereafter the daily run keeps it alive.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev --python "3.12"

      - name: Run Bandit security scan
        run: |
          uv run --locked bandit -r mitre_mcp/ -c pyproject.toml -f json -o bandit-report.json
          uv run --locked bandit -r mitre_mcp/ -c pyproject.toml

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev --python "3.12"

      - name: Audit locked dependencies with pip-audit
        run: |
          uv export --frozen --no-emit-project > requirements-scan.txt
          uv run --locked pip-audit -r requirements-scan.txt --format json --output dependency-audit-report.json
          uv run --locked pip-audit -r requirements-scan.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
