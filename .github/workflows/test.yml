name: Tests

on:
  push:
    branches: [main, develop, claude/*]
    paths-ignore:
      - "frontend/**"
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"
      - "**.md"
      - "docs/**"
  schedule:
    # Weekly regression run — catches upstream breakage even without pushes
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }} (locked deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Full OS × Python matrix on the weekly schedule / manual dispatch;
      # push/PR runs a slim matrix to keep per-push job count low.
      matrix: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('{"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.11","3.12","3.13","3.14"]}') || fromJSON('{"os":["ubuntu-latest","macos-latest"],"python-version":["3.11"],"include":[{"os":"ubuntu-latest","python-version":"3.14"}]}') }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install locked dependencies
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: |
          uv run --locked pytest --cov=mitre_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  test-latest:
    name: Test latest-resolved dependencies (Python 3.14 on ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install latest dependencies (open resolution)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run test suite of record
        run: |
          pytest -q -p no:cacheprovider -o addopts=""
